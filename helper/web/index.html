<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Remote</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Remote">
<style>
  /* Design tokens follow the feature site (docs/style.css): dark navy surfaces, indigo-to-violet accents. */
  :root {
    --bg: #0b0d12; --card: #141821; --chip: #1b2030; --line: #262c3d;
    --text: #e8ebf2; --muted: #9aa3b8;
    --accent: #5b8cff; --accent-2: #a46bff; --purple: #b9a6ff;
    --green: #3ccf91; --red: #ff5d6c; --amber: #ffb547; --orange: #ff7a45;
    --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
    --radius: 16px; --radius-sm: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7fb; --card: #fff; --chip: #eef1f8; --line: #dde2ee; --text: #141821; --muted: #5a6378; --purple: #7a5cff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
  .tabs, .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs { margin-bottom: 12px; }
  button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px; cursor: pointer; }
  button:hover { filter: brightness(1.12); }
  button.primary, button.sel { background: var(--grad); border-color: transparent; color: #fff; font-weight: 600; }
  button.purple { background: var(--grad); border-color: transparent; color: #fff; }
  .tabs button, .chips button { border-radius: 999px; padding: 7px 14px; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 2px; }
  .card.parent { border: 1px dashed color-mix(in srgb, var(--purple) 60%, var(--line)); }
  .muted { color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .banner { background: color-mix(in srgb, var(--accent-2) 14%, var(--card)); border: 1px dashed color-mix(in srgb, var(--purple) 60%, var(--line)); color: var(--text); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; }
  .banner b { color: var(--purple); }
  .banner button { background: var(--grad); border-color: transparent; color: #fff; padding: 5px 14px; border-radius: 999px; }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 8px; justify-content: center; margin: 10px 0; }
  .pad button { height: 56px; font-size: 18px; border-radius: var(--radius); }
  .pad button:active { background: var(--grad); color: #fff; }
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .apps button { padding: 14px 6px; font-weight: 600; border-radius: var(--radius-sm); }
  input[type=text], input[type=time], input[type=number] { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; color-scheme: dark; }
  @media (prefers-color-scheme: light) { input { color-scheme: light; } }
  input[type=range] { width: 100%; accent-color: var(--accent-2); }
  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 12px; transition: .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--grad); }
  .switch input:checked + span::before { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rule { padding: 12px 0; border-top: 1px solid var(--line); }
  .rule:first-of-type { border-top: 0; }
  .rule .extra { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stat { display: flex; gap: 10px; }
  .stat div { flex: 1; background: var(--chip); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; }
  .stat b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .hist { padding: 10px 0; border-top: 1px solid var(--line); }
  .hist:first-child { border-top: 0; }
  .hist.blocked { background: color-mix(in srgb, var(--red) 10%, transparent); border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); border-radius: var(--radius-sm); padding: 10px 12px; margin: 6px 0; }
  .bad { color: var(--red); }
  .live { color: var(--green); font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--chip); border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: var(--radius-sm); opacity: 0; transition: .2s; pointer-events: none; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .toast.show { opacity: 1; }
  .dim { opacity: .45; pointer-events: none; }
  .chiplist span { display: inline-flex; gap: 4px; align-items: center; background: var(--chip); border-radius: 12px; padding: 3px 8px; margin: 2px; font-size: 12px; }
  .chiplist a { cursor: pointer; color: var(--muted); }
  .allapps { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 10px; max-height: 320px; overflow-y: auto; }
  .allapps button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font-size: 11px; background: transparent; }
  .allapps button:hover { background: var(--chip); }
  .allapps img, .allapps .ph { width: 40px; height: 40px; border-radius: 9px; }
  .allapps .ph { background: var(--chip); display: grid; place-items: center; font-weight: 700; color: var(--muted); font-size: 17px; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .pinbox { font-size: 28px; letter-spacing: 8px; text-align: center; width: 100%; padding: 12px !important; }
  .big { font-size: 26px; font-weight: 700; letter-spacing: 2px; user-select: all; }
  /* phones and tablets: bigger buttons for thumbs */
  @media (pointer: coarse) {
    main { padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
    button { padding: 11px 14px; }
    .pad { grid-template-columns: repeat(3, minmax(72px, 96px)); gap: 12px; }
    .pad button { height: 76px; font-size: 24px; border-radius: 16px; }
    .apps button { padding: 18px 6px; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><span>📺</span> TV Remote <span id="helperdot" class="dot"></span></h1>
  <div id="login" class="card" hidden>
    <h2>Enter the PIN</h2>
    <div class="muted">Find it in the TV Remote app on the computer, under Phone.</div>
    <form style="margin-top:12px" onsubmit="event.preventDefault();login()">
      <input type="text" id="pin" class="pinbox" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
      <button class="primary" style="width:100%;margin-top:10px">Connect</button>
    </form>
  </div>
  <div id="empty" class="card" hidden>
    <h2>Add your first TV</h2>
    <div class="muted">Turn the TV on and connect it to the same Wi-Fi as this computer.</div>
    <div style="margin-top:10px"><button class="primary" onclick="openAdd()">Add a TV</button></div>
  </div>
  <div id="app" hidden>
    <div class="tabs" id="tvtabs"></div>
    <div id="banner" class="banner" hidden></div>
    <div class="tabs" id="pages"></div>
    <section id="page-remote"></section>
    <section id="page-rules" hidden></section>
    <section id="page-history" hidden></section>
    <section id="page-phone" hidden></section>
  </div>
  <div id="add" class="card" hidden></div>
</main>
<div id="toast" class="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const state = { status: null, tv: null, page: "remote", editing: false, adding: null, showApps: false, apps: {}, appsMsg: {}, phone: null };
const ALL_PAGES = [["remote", "Remote"], ["rules", "Rules"], ["history", "History"], ["phone", "Phone"]];
let PAGES = ALL_PAGES.slice(0, 3);                 // "Phone" only appears on the computer itself
const APPS = [["youtube", "YouTube"], ["primevideo", "Prime Video"], ["netflix", "Netflix"], ["hotstar", "Hotstar"], ["sonyliv", "SonyLIV"], ["zee5", "ZEE5"]];

function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 3500);
}
async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { toast((await r.text()) || "Something went wrong"); return null; }
    const data = await r.json().catch(() => ({}));
    refresh();
    return data;
  } catch (e) { toast("The helper isn't running"); return null; }
}
const send = (extra) => post(extra.path, { tv: state.tv, ...extra.body });
const key = (k) => post("/key", { tv: state.tv, key: k });
const setRule = (id, config) => post("/rules", { tv: state.tv, id, config });

const dur = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h} h ${m} min` : `${m} min`; };
const tvOf = () => state.status && state.status.tvs.find((t) => t.id === state.tv);
const rulesOf = () => state.status && state.status.rules[state.tv];
const parentOf = () => state.status && state.status.parent[state.tv];

async function refresh() {
  try {
    const r = await fetch("/status");
    if (r.status === 401 || r.status === 403) { showLogin(r.status === 403); return; }
    $("login").hidden = true;
    state.status = await r.json();
    $("helperdot").className = "dot on";
  } catch (e) {
    $("helperdot").className = "dot";
    return;
  }
  const tvs = state.status.tvs;
  if (!tvs.find((t) => t.id === state.tv)) state.tv = tvs.length ? tvs[0].id : null;
  render();
}

function render() {
  const tvs = state.status.tvs;
  $("empty").hidden = tvs.length > 0 || !!state.adding;
  $("app").hidden = tvs.length === 0 || !!state.adding;
  if (state.adding) return;
  if (!tvs.length) return;
  $("tvtabs").innerHTML = tvs.map((t) =>
    `<button class="${t.id === state.tv ? "sel" : ""}" onclick="pick('${esc(t.id)}')"><span class="dot ${t.online && t.on !== false ? "on" : ""}"></span> ${esc(t.name)}</button>`
  ).join("") + `<button onclick="openAdd()">+ Add TV</button>`;
  $("pages").innerHTML = PAGES.map(([id, label]) =>
    `<button class="${id === state.page ? "sel" : ""}" onclick="showPage('${id}')">${label}</button>`).join("");
  const p = parentOf();
  const b = $("banner");
  b.hidden = !(p && p.active);
  if (p && p.active) {
    const left = p.seconds_left == null ? "until you end it" : dur(p.seconds_left) + " left";
    b.innerHTML = `<div class="row between"><div><b>Parent mode on</b><div style="font-size:12px;opacity:.9">${left}${p.scheduled ? " · scheduled" : ""} · no rules or tracking</div></div><button onclick="endParent()">End</button></div>`;
  }
  for (const [id] of ALL_PAGES) $("page-" + id).hidden = id !== state.page;
  if (state.editing) return;                      // don't redraw while someone is typing
  if (state.page === "remote") renderRemote();
  if (state.page === "rules") renderRules();
  if (state.page === "history") renderHistory();
  if (state.page === "phone") renderPhone();
}

// --- phone access ----------------------------------------------------------
function showLogin(off) {
  $("helperdot").className = "dot on";
  $("app").hidden = true; $("empty").hidden = true;
  const box = $("login"); box.hidden = false;
  box.querySelector("h2").textContent = off ? "Phone access is off" : "Enter the PIN";
  box.querySelector(".muted").textContent = off
    ? "Turn on phone access in the TV Remote app on the computer (Phone), then reload this page."
    : "Find it in the TV Remote app on the computer, under Phone.";
  box.querySelector("form").hidden = off;
}
async function login() {
  const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: $("pin").value }) })
    .catch(() => null);
  if (!r) return toast("Can't reach the computer");
  if (!r.ok) { $("pin").value = ""; return toast((await r.text()) || "Wrong PIN"); }
  $("pin").blur(); refresh();
}
async function loadPhone() {
  try {
    const r = await fetch("/phone");
    state.phone = r.ok ? await r.json() : null;
  } catch (e) { state.phone = null; }
  PAGES = state.phone ? ALL_PAGES : ALL_PAGES.slice(0, 3);
}
async function setPhone(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).catch(() => null);
  if (!r || !r.ok) return toast("Couldn't change phone access");
  state.phone = await r.json();
  if (state.phone.error) toast(state.phone.error);
  renderPhone();
}
function renderPhone() {
  const p = state.phone; if (!p) return;
  const url = p.url || (p.ip ? `http://${p.ip}:${location.port || 8765}/` : null);
  $("page-phone").innerHTML = `
    <div class="card">
      <div class="row between"><div><b>Phone remote over Wi-Fi</b>
        <div class="muted">Use a phone on the same Wi-Fi as a remote. This computer must stay on with TV Remote running.</div></div>
        <label class="switch"><input type="checkbox" ${p.enabled ? "checked" : ""} onchange="setPhone('/phone',{enabled:this.checked})"><span></span></label></div>
      ${p.enabled ? (p.running ? `
        <div style="margin-top:12px"><span class="muted">On the phone, open</span><div class="big">${esc(p.url)}</div></div>
        <div style="margin-top:8px"><span class="muted">and enter the PIN</span><div class="big">${esc(p.pin)}</div></div>
        <div class="muted" style="margin-top:8px">${p.phones} phone${p.phones === 1 ? "" : "s"} connected. Then use Share → Add to Home Screen to keep it as an app.</div>
        <div style="margin-top:10px"><button onclick="if(confirm('Make a new PIN? Every phone will need to enter it again.'))setPhone('/phone/pin')">New PIN (signs out phones)</button></div>`
      : `<div class="muted" style="margin-top:10px;color:var(--red)">Couldn't open the Wi-Fi port${url ? " on " + esc(url) : ""}. Check that this computer is on Wi-Fi, then switch this off and on again.</div>`) : ""}
    </div>
    <div class="muted">Anyone on your Wi-Fi who knows the PIN can control the TVs and change the rules, so keep it private.
      After many wrong PINs, phones can't sign in for 5 minutes.
      Guest networks that keep devices apart will block the phone. On Windows, allow TV Remote on private networks when the firewall asks.</div>`;
}
function pick(id) { state.tv = id; state.editing = false; if (state.showApps && !state.apps[id]) loadApps(id); render(); }
function showPage(id) { state.page = id; state.editing = false; if (id === "phone") loadPhone().then(render); else render(); }
document.addEventListener("focusin", (e) => { if (e.target.matches("input[type=text],input[type=number],input[type=time]")) state.editing = true; });
document.addEventListener("focusout", () => { state.editing = false; });

function renderRemote() {
  const t = tvOf();
  const status = !t.online ? (t.power === "standby" ? "Standby (screen off)" : t.power === "off" ? "Powered off or off Wi-Fi" : "Not connected") : (t.on === false ? "Screen off" : "On");
  const vol = t.volume;
  const pad = (k, label) => `<button onclick="key('${k}')">${label}</button>`;
  $("page-remote").innerHTML = `
    <div class="card">
      <div class="row between"><div><h2>${esc(t.name)} <span class="muted" style="font-size:13px;font-weight:normal">${esc(t.ip)}</span></h2><div class="muted">${esc(status)}${t.app ? " · " + esc(t.app) : ""}</div></div>
        <div class="row"><button onclick="key('POWER')">⏻ Power</button>${!t.online || t.on === false ? `<button onclick="wake()">Wake</button>` : ""}</div></div>
      ${t.title ? `<div style="margin-top:10px"><b>${esc(t.title)}</b><div class="muted">${esc(t.channel || "")}</div></div>` : ""}
      ${t.duration ? `<div class="row" style="margin-top:8px"><button onclick="pb('toggle')">${t.playing ? "⏸" : "▶"}</button>
        <button onclick="pb('skip',-10)">−10 s</button><button onclick="pb('skip',10)">+10 s</button>
        <span class="muted">${dur(t.position)} of ${dur(t.duration)}</span></div>` : ""}
    </div>
    <div class="card">
      <div class="pad">
        ${pad("BACK", "↩")}${pad("DPAD_UP", "▲")}${pad("HOME", "⌂")}
        ${pad("DPAD_LEFT", "◀")}${pad("DPAD_CENTER", "OK")}${pad("DPAD_RIGHT", "▶")}
        ${pad("MUTE", "🔇")}${pad("DPAD_DOWN", "▼")}${pad("MENU", "☰")}
        ${pad("VOLUME_DOWN", "🔉")}${pad("POWER", "⏻")}${pad("VOLUME_UP", "🔊")}
      </div>
      ${vol ? `<div class="row" style="margin-top:6px"><span class="muted">Volume</span>
        <input type="range" min="0" max="${vol.max || 100}" value="${vol.level}" onchange="post('/volume',{tv:state.tv,level:+this.value})">
        <span class="muted" style="width:30px;text-align:right">${vol.level}</span></div>` : ""}
    </div>
    <div class="card"><h2 style="margin-bottom:8px">Open an app</h2>
      <div class="apps">${APPS.map(([k, n]) => `<button onclick="post('/launch',{tv:state.tv,app:'${k}'})">${n}</button>`).join("")}</div>
      <div style="margin-top:8px"><button onclick="toggleApps()">${state.showApps ? "▴" : "▾"} All apps on this TV</button></div>
      ${state.showApps ? allAppsHtml() : ""}
    </div>
    ${state.status.features && state.status.features.camera ? "" : `<div class="muted" style="text-align:center">Camera to TV and playing files from this computer are only in the Mac app.</div>`}`;
}
function allAppsHtml() {
  const list = state.apps[state.tv];
  const msg = state.appsMsg[state.tv];
  if (!list) return `<div class="muted" style="margin-top:8px">${esc(msg || "Asking the TV for its apps…")}
    ${msg ? `<button style="margin-left:6px;padding:3px 10px" onclick="loadApps(state.tv)">Try again</button>` : ""}</div>`;
  if (!list.length) return `<div class="muted" style="margin-top:8px">The TV didn't report any apps</div>`;
  return `<div class="allapps">${list.map((a, i) => `<button title="Open ${esc(a.name)}" onclick="openApp(${i})">
    ${a.icon ? `<img src="${esc(a.icon)}" alt="">` : `<span class="ph">${esc(a.name.slice(0, 1).toUpperCase())}</span>`}
    <span>${esc(a.name)}</span></button>`).join("")}</div>`;
}
async function loadApps(tv) {
  state.appsMsg[tv] = null; delete state.apps[tv]; refresh();
  try {
    const r = await fetch("/apps?tv=" + encodeURIComponent(tv));
    const data = await r.json().catch(() => ({}));
    if (r.ok) state.apps[tv] = data.apps;
    else state.appsMsg[tv] = data.error || (r.status === 503 ? "The TV isn't connected" : "Couldn't get the TV's apps");
  } catch (e) { state.appsMsg[tv] = "The helper isn't running"; }
  refresh();
}
function toggleApps() {
  state.showApps = !state.showApps;
  if (state.showApps && !state.apps[state.tv]) loadApps(state.tv); else refresh();
}
function openApp(i) {
  const a = state.apps[state.tv][i];
  toast("Opening " + a.name + "…");
  post("/launch", { tv: state.tv, package: a.package });
}
const pb = (action, delta) => post("/playback", { tv: state.tv, action, ...(delta ? { delta } : {}) });
const wake = () => post("/wake", { tv: state.tv }).then((r) => r && toast("Wake signal sent, it can take up to 30 seconds"));
const endParent = () => post("/parent", { tv: state.tv, on: false });
const startParent = (minutes) => post("/parent", { tv: state.tv, on: true, ...(minutes ? { minutes } : {}) });

function toggle(id, on, label, sub, extra) {
  return `<div class="rule"><div class="row between"><div><b>${label}</b><div class="muted">${sub}</div></div>
    <label class="switch"><input type="checkbox" ${on ? "checked" : ""} onchange="setRule('${id}',{enabled:this.checked})"><span></span></label></div>
    ${extra ? `<div class="extra">${extra}</div>` : ""}</div>`;
}
function channelList(id, rule) {
  const chips = rule.channels.map((c, i) => `<span>${esc(c)} <a onclick="delChannel('${id}',${i})">✕</a></span>`).join("");
  return `<div class="chiplist" style="width:100%">${chips}</div><input type="text" placeholder="Channel name" id="in-${id}" style="flex:1">
    <button onclick="addChannel('${id}')">Add</button>`;
}
function addChannel(id) {
  const v = $("in-" + id).value.trim(); if (!v) return;
  setRule(id, { channels: [...rulesOf()[id].channels, v] });
}
function delChannel(id, i) { setRule(id, { channels: rulesOf()[id].channels.filter((_, j) => j !== i) }); }
// YouTube keeps the video id in the thumbnail address; for other apps fall back to a web search for the title.
function webLink(e) {
  const m = /ytimg\.com\/vi\/([^/]+)\//.exec(e.thumb || "");
  if (m) return { url: "https://www.youtube.com/watch?v=" + m[1], exact: true };
  if (e.title) return { url: "https://www.google.com/search?q=" + encodeURIComponent(e.title + " " + e.app), exact: false };
  return null;
}
const timeInput = (id, k, v) => `<input type="time" value="${v}" onchange="setRule('${id}',{${k}:this.value})">`;

function renderRules() {
  const r = rulesOf(), t = tvOf(), p = parentOf();
  const sch = r.parent_schedule;
  $("page-rules").innerHTML = `
    <div class="card parent">
      <h2 style="color:var(--purple)">Parent mode</h2>
      <div class="muted">No rules, no restrictions and no tracking on ${esc(t.name)}</div>
      ${p.active ? `<div class="chips" style="margin-top:8px"><button onclick="startParent(Math.floor((${p.seconds_left || 0})/60)+30)" ${p.seconds_left == null ? "disabled" : ""}>Add 30 min</button><button class="purple" onclick="endParent()">End parent mode</button></div>`
        : `<div class="chips" style="margin-top:8px">${[[30, "30 min"], [60, "1 h"], [120, "2 h"], [240, "4 h"]].map(([m, l]) => `<button onclick="startParent(${m})">${l}</button>`).join("")}<button onclick="startParent()">Until I stop</button></div>`}
      <div class="rule" style="margin-top:12px">
        <div class="row between"><b>Every day at a fixed time</b>
          <label class="switch"><input type="checkbox" ${sch.enabled ? "checked" : ""} onchange="setRule('parent_schedule',{enabled:this.checked})"><span></span></label></div>
        <div class="extra"><span class="muted">From</span>${timeInput("parent_schedule", "start", sch.start)}<span class="muted">to</span>${timeInput("parent_schedule", "end", sch.end)}</div>
        <div class="muted" style="margin-top:4px">Pressing End inside the window turns it off until tomorrow.</div>
      </div>
    </div>
    <div class="card ${p.active ? "dim" : ""}">
      ${toggle("title_filter", r.title_filter.enabled, "Kid-friendly filter", "Sends the TV Home when a flagged YouTube title plays")}
      ${toggle("adult_filter", r.adult_filter.enabled, "Adult content filter", "Blocks adult titles and channels")}
      ${toggle("block_shorts", r.block_shorts.enabled, "Block YouTube Shorts", "Needs network debugging on the TV" + (t.adb ? "" : " (not set up on this TV)"))}
      ${toggle("screen_time", r.screen_time.enabled, "Daily screen time", `${dur(state.status.usage[state.tv])} used today`,
        `<input type="number" min="15" max="720" step="15" value="${r.screen_time.minutes}" style="width:80px" onchange="setRule('screen_time',{minutes:+this.value})"><span class="muted">minutes a day · warn on the TV</span><input type="number" min="1" max="30" value="${r.screen_time.warn_minutes ?? 5}" style="width:60px" onchange="setRule('screen_time',{warn_minutes:+this.value})"><span class="muted">min before the limit or bedtime</span>`)}
      ${toggle("bedtime", r.bedtime.enabled, "Bedtime", "Keeps the TV off between these times",
        `<span class="muted">From</span>${timeInput("bedtime", "start", r.bedtime.start)}<span class="muted">to</span>${timeInput("bedtime", "end", r.bedtime.end)}`)}
      ${toggle("volume_cap", r.volume_cap.enabled, "Volume cap", "The volume can't go above this",
        `<input type="range" min="5" max="100" value="${r.volume_cap.max}" style="flex:1" onchange="setRule('volume_cap',{max:+this.value})"><span class="muted">${r.volume_cap.max}</span>`)}
      ${toggle("allow_channels", r.allow_channels.enabled, "Allowed YouTube channels", "Anything from other channels goes Home", channelList("allow_channels", r.allow_channels))}
      ${toggle("block_channels", r.block_channels.enabled, "Restricted YouTube channels", "Anything from these channels goes Home", channelList("block_channels", r.block_channels))}
      ${toggle("history", r.history.enabled, "Keep watch history", "Records what was watched")}
    </div>`;
}

function histRow(e) {
  const w = webLink(e), when = esc(String(e.ts).replace("T", " ").slice(0, 16));
  if (e.blocked) {
    const act = e.can_allow ? (e.allowed
      ? `<button onclick="allowVideo(${esc(JSON.stringify(JSON.stringify([e.title, e.channel])))},false)" title="Block this video again">Allowed · Undo</button>`
      : `<button class="purple" onclick="allowVideo(${esc(JSON.stringify(JSON.stringify([e.title, e.channel])))},true)" title="Let this video play next time">Allow</button>`) : "";
    return `<div class="hist blocked row between"><div><b>${esc(e.title || e.app)}</b> <span class="bad">· Blocked</span>
      <div class="muted">${esc(e.app)}${e.channel ? " · " + esc(e.channel) : ""} · ${when}</div>
      <div class="muted bad">Because: ${esc(e.reason || "a rule")}</div></div>
      <div class="chips">${w && e.title ? `<a href="${esc(w.url)}" target="_blank" rel="noopener"><button>${w.exact ? "Open" : "Search"}</button></a>` : ""}${act}</div></div>`;
  }
  return `<div class="hist row between"><div><b>${esc(e.title || e.app)}</b>${e.live ? ` <span class="live">· playing now</span>` : ""}
    <div class="muted">${esc(e.app)}${e.channel ? " · " + esc(e.channel) : ""} · ${dur(e.watched)} · ${when}</div></div>
    ${w ? `<a href="${esc(w.url)}" target="_blank" rel="noopener"><button title="${w.exact ? "Open this video in your browser" : "Search for this title in your browser"}">${w.exact ? "Open" : "Search"}</button></a>` : ""}</div>`;
}
async function allowVideo(json, allow) {
  const [title, channel] = JSON.parse(json);
  await post("/allow", { tv: state.tv, title, channel, allow });
}

function renderHistory() {
  const s = state.status, d = s.today[state.tv] || { apps: {}, channels: {}, plays: 0 };
  const play = Object.values(d.apps).reduce((a, b) => a + b, 0);
  const all = s.history.filter((e) => e.tv_id === state.tv);
  const rows = state.blockedOnly ? all.filter((e) => e.blocked) : all;
  const nBlocked = all.filter((e) => e.blocked).length;
  const top = Object.entries(d.channels).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $("page-history").innerHTML = `
    ${parentOf().active ? `<div class="muted" style="color:var(--purple);margin-bottom:8px">Parent mode is on: nothing is being recorded.</div>` : ""}
    <div class="card"><div class="stat">
      <div><span class="muted">Play time today</span><b>${dur(play)}</b></div>
      <div><span class="muted">TV on today</span><b>${dur(s.usage[state.tv])}</b></div></div>
      ${top.length ? `<div style="margin-top:10px" class="muted">Top channels: ${top.map(([n, v]) => `${esc(n)} (${dur(v)})`).join(", ")}</div>` : ""}
      <div class="chips" style="margin-top:10px"><button onclick="location.href='/export?tv='+state.tv">Export CSV</button>
        <button onclick="if(confirm('Clear the history for this TV?'))post('/history/clear',{tv:state.tv})">Clear history</button></div>
    </div>
    <div class="card"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">Sessions</h2>
      <label class="row" style="gap:8px"><span class="muted">Blocked only (${nBlocked})</span>
        <span class="switch"><input type="checkbox" ${state.blockedOnly ? "checked" : ""} onchange="state.blockedOnly=this.checked;renderHistory()"><span></span></span></label></div>
      ${rows.length ? rows.slice(0, 40).map(histRow).join("") : `<div class="muted">${state.blockedOnly ? "Nothing has been blocked." : "Nothing watched yet."}</div>`}
    </div>`;
}

// --- adding a TV ---------------------------------------------------------
async function openAdd() {
  state.adding = { step: "scan" }; state.editing = false;
  $("empty").hidden = true; $("app").hidden = true;
  drawAdd();
  const r = await fetch("/discover").then((x) => x.json()).catch(() => []);
  state.adding.found = r; state.adding.step = "pick"; drawAdd();
}
function closeAdd() { state.adding = null; $("add").hidden = true; render(); }
function drawAdd() {
  const a = state.adding; if (!a) return;
  const box = $("add"); box.hidden = false;
  if (a.step === "scan") { box.innerHTML = `<h2>Add a TV</h2><div class="muted">Looking for TVs on your Wi-Fi…</div>`; return; }
  if (a.step === "pick") {
    box.innerHTML = `<h2>Add a TV</h2><div class="muted">Turn the TV on first. Pick it below or type its IP address (TV Settings → Network).</div>
      <div style="margin:10px 0">${(a.found || []).map((f) => `<button style="margin:2px" onclick="startPair('${esc(f.ip)}')">${esc(f.name)} · ${esc(f.ip)}</button>`).join("") || `<span class="muted">No TVs found automatically.</span>`}</div>
      <div class="row"><input type="text" id="ip" placeholder="192.168.1.20" style="flex:1"><input type="text" id="nm" placeholder="Name (optional)" style="flex:1">
        <button class="primary" onclick="startPair($('ip').value)">Next</button></div>
      <div style="margin-top:10px"><button onclick="closeAdd()">Cancel</button></div>`;
    return;
  }
  if (a.step === "code") {
    box.innerHTML = `<h2>Enter the code shown on the TV</h2><div class="muted">${esc(a.ip)}</div>
      <div class="row" style="margin-top:10px"><input type="text" id="code" maxlength="6" placeholder="6-character code" style="flex:1" autofocus>
        <button class="primary" onclick="finishPair()">Pair</button><button onclick="closeAdd()">Cancel</button></div>`;
  }
}
async function startPair(ip) {
  ip = (ip || "").trim();
  const name = ($("nm") && $("nm").value) || "";
  toast("Contacting the TV…");
  const r = await post("/pair/start", { ip, name });
  if (r) { state.adding = { step: "code", ip, name }; drawAdd(); }
}
async function finishPair() {
  const r = await post("/pair/finish", { ip: state.adding.ip, code: $("code").value });
  if (r) { toast("Added " + r.name); state.tv = r.id; closeAdd(); }
}

loadPhone().then(refresh);
setInterval(() => { if (!state.adding && $("login").hidden) refresh(); }, 2000);
</script>
</body>
