name: Release

# Every push runs the tests. Only main goes on to build the Mac and Windows installers and publish them as a GitHub release.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the next version
        id: v
        run: |
          # Major.minor come from the VERSION file; the patch number is how many commits are on main.
          base=$(cat VERSION)
          echo "version=${base}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  # Helper (Python) tests. test_media.py converts real files, so it needs ffmpeg.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r helper/requirements.txt
      # The helper tests are plain assert scripts (no test functions yet), so pytest would collect nothing.
      - run: python -W ignore helper/tests/test_rules.py
      - run: python -W ignore helper/tests/test_phone.py
      - run: python -W ignore helper/tests/test_media.py

  # Mac app tests: the Status decoder against a saved /status reply.
  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  mac:
    if: github.ref == 'refs/heads/main'
    needs: [version, test, swift-test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r helper/requirements.txt pyinstaller==6.11.1
      - name: Build the app
        run: VERSION=${{ needs.version.outputs.version }} ./build.sh --bundle
      - name: Make the disk image
        run: |
          mkdir dmg && cp -R TVRemote.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "TV Remote" -srcfolder dmg -ov -format UDZO \
            "TVRemote-${{ needs.version.outputs.version }}-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: "*.dmg"

  windows:
    if: github.ref == 'refs/heads/main'
    needs: [version, test, swift-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r windows/requirements.txt
      - name: Build TVRemote.exe
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name TVRemote --distpath dist --workpath build/win \
            --specpath build/win --paths helper --add-data "$(pwd -W)/helper/web;web" \
            --collect-all pychromecast --collect-all androidtvremote2 --collect-all zeroconf \
            --collect-submodules adb_shell --collect-all webview windows/app.py
      - name: Make the installer
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          export MSYS2_ARG_CONV_EXCL="*"
          "$ISCC" "/DAppVersion=${{ needs.version.outputs.version }}" windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TVRemote-Setup-*.exe

  release:
    if: github.ref == 'refs/heads/main'
    needs: [version, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > intro.md <<'NOTE'
          **Install**
          - **Mac:** open the `.dmg`, drag TV Remote to Applications. The app is not signed with an Apple developer ID, so the first time, right-click it and choose Open.
          - **Windows:** run `TVRemote-Setup-*.exe`. Windows may warn about an unknown publisher: choose More info, then Run anyway.

          Camera to TV and playing files from the computer are Mac-only. Add your TVs from the app (Mac: gear menu, Add a TV).

          ---
          NOTE
          gh release create "v$VERSION" artifacts/* \
            --title "TV Remote $VERSION" --notes-file intro.md --generate-notes --target "$GITHUB_SHA"
