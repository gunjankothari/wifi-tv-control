<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <g id="on"><rect width="44" height="26" rx="13" fill="url(#brand)"/><circle cx="31" cy="13" r="10" fill="#fff"/></g>
    <g id="off"><rect width="44" height="26" rx="13" fill="#262c3d"/><circle cx="13" cy="13" r="10" fill="#9aa3b8"/></g>
  </defs>
  <rect x="1" y="1" width="518" height="478" rx="18" fill="#141821" stroke="#262c3d" stroke-width="2"/>
  <text x="28" y="44" fill="#e8ebf2" font-size="18" font-weight="700">Rules · Kids room</text>
  <text x="492" y="44" text-anchor="end" fill="#9aa3b8" font-size="12">Each TV has its own rules</text>

  <g font-size="14" font-weight="600" fill="#e8ebf2">
    <rect x="20" y="64" width="480" height="56" rx="12" fill="#1b2030"/>
    <text x="40" y="90">Kid filter</text><text x="40" y="108" fill="#9aa3b8" font-size="12" font-weight="400">Goes back when a scary or violent title starts</text>
    <use href="#on" x="436" y="79"/>

    <rect x="20" y="128" width="480" height="56" rx="12" fill="#1b2030"/>
    <text x="40" y="154">Block YouTube Shorts</text><text x="40" y="172" fill="#9aa3b8" font-size="12" font-weight="400">Leaves Shorts as soon as one appears</text>
    <use href="#on" x="436" y="143"/>

    <rect x="20" y="192" width="480" height="56" rx="12" fill="#1b2030"/>
    <text x="40" y="218">Allowed channels only</text><text x="40" y="236" fill="#9aa3b8" font-size="12" font-weight="400">Nature Club, Kids Science, Art for Kids</text>
    <use href="#off" x="436" y="207"/>

    <rect x="20" y="256" width="480" height="76" rx="12" fill="#1b2030"/>
    <text x="40" y="282">Daily screen time</text><text x="480" y="282" text-anchor="end" fill="#ffc979" font-size="13">78 of 120 min</text>
    <rect x="40" y="296" width="440" height="10" rx="5" fill="#262c3d"/>
    <rect x="40" y="296" width="286" height="10" rx="5" fill="url(#warm)"/>
    <text x="40" y="322" fill="#9aa3b8" font-size="12" font-weight="400">The TV turns off when the time is used up</text>

    <rect x="20" y="340" width="236" height="68" rx="12" fill="#1b2030"/>
    <text x="40" y="366">Bedtime</text>
    <text x="40" y="392" fill="#c9b3ff" font-size="16" font-weight="700">21:00 – 07:00</text>
    <path d="M226 358a12 12 0 1 0 12 16 9 9 0 0 1-12-16z" fill="#a46bff"/>

    <rect x="264" y="340" width="236" height="68" rx="12" fill="#1b2030"/>
    <text x="284" y="366">Volume cap</text>
    <rect x="284" y="384" width="140" height="6" rx="3" fill="#262c3d"/>
    <rect x="284" y="384" width="70" height="6" rx="3" fill="url(#brand)"/>
    <circle cx="354" cy="387" r="8" fill="#fff"/>
    <text x="480" y="392" text-anchor="end" fill="#9aa3b8" font-size="13">max 30</text>
  </g>
  <!-- parent mode -->
  <rect x="20" y="420" width="480" height="44" rx="12" fill="none" stroke="#5b8cff" stroke-dasharray="4 4"/>
  <text x="40" y="447" fill="#e8ebf2" font-size="13" font-weight="600">Parent mode</text>
  <text x="138" y="447" fill="#9aa3b8" font-size="12">Pause all rules for a while</text>
  <rect x="392" y="428" width="96" height="28" rx="8" fill="url(#brand)"/>
  <text x="440" y="447" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Start · 1 h</text>
</svg>
