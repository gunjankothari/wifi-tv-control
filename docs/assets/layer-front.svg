<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <!-- Foreground parallax layer: floating "signal" chips and glints that drift fastest.
       Keep it sparse: it sits over the hero text. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
  </defs>
  <!-- left: small play chip -->
  <g transform="translate(150 560) rotate(-8)" opacity=".75">
    <rect width="88" height="56" rx="14" fill="#141821" stroke="url(#b)" stroke-width="2"/>
    <path d="M38 18l16 10-16 10z" fill="url(#b)"/>
  </g>
  <!-- right: shield chip -->
  <g transform="translate(1380 220) rotate(10)" opacity=".75">
    <rect width="72" height="72" rx="18" fill="#141821" stroke="url(#b)" stroke-width="2"/>
    <path d="M36 16l16 6v12c0 10-7 17-16 20-9-3-16-10-16-20V22z" stroke="url(#b)" stroke-width="3"/>
  </g>
  <!-- right low: moon chip -->
  <g transform="translate(1300 650) rotate(-6)" opacity=".6">
    <rect width="60" height="60" rx="16" fill="#141821" stroke="#262c3d" stroke-width="2"/>
    <path d="M41 35a12 12 0 1 1-15-15 10 10 0 0 0 15 15z" fill="#a46bff"/>
  </g>
  <!-- left high: wifi chip -->
  <g transform="translate(250 170) rotate(6)" opacity=".6">
    <rect width="60" height="60" rx="16" fill="#141821" stroke="#262c3d" stroke-width="2"/>
    <g stroke="#5b8cff" stroke-width="3" stroke-linecap="round"><path d="M16 26a20 20 0 0 1 28 0"/><path d="M21 32a12 12 0 0 1 18 0"/></g>
    <circle cx="30" cy="40" r="3" fill="#5b8cff"/>
  </g>
  <!-- glints -->
  <g fill="#e8ebf2">
    <path d="M520 120l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".5"/>
    <path d="M1120 760l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" opacity=".4"/>
    <path d="M1490 470l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" opacity=".35"/>
  </g>
</svg>
