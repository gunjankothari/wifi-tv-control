<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
  </defs>
  <!-- Wi-Fi rings radiating from the TV position (centre, lower third) -->
  <g stroke="url(#ring)" stroke-linecap="round">
    <path d="M560 640a240 240 0 0 1 480 0" stroke-width="3" opacity=".45"/>
    <path d="M440 640a360 360 0 0 1 720 0" stroke-width="2.5" opacity=".32"/>
    <path d="M320 640a480 480 0 0 1 960 0" stroke-width="2" opacity=".22"/>
    <path d="M200 640a600 600 0 0 1 1200 0" stroke-width="1.5" opacity=".14"/>
    <path d="M80 640a720 720 0 0 1 1440 0" stroke-width="1" opacity=".08"/>
  </g>
  <!-- faint floor grid for depth -->
  <g stroke="#5b8cff" stroke-width="1" opacity=".08">
    <path d="M0 760h1600M0 820h1600M0 880h1600"/>
    <path d="M800 700L0 900M800 700L400 900M800 700L800 900M800 700L1200 900M800 700L1600 900"/>
  </g>
</svg>
