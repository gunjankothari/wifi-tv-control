<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1c1436"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fdb"/><stop offset="1" stop-color="#3fd0e0"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ccf91"/><stop offset="1" stop-color="#1f8a6a"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a46bff"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="480" cy="300" rx="470" ry="300" fill="url(#glow)"/>
  <!-- stand -->
  <path d="M400 560h160l24 44H376z" fill="#1b2030"/>
  <rect x="330" y="600" width="300" height="12" rx="6" fill="#262c3d"/>
  <!-- bezel -->
  <rect x="60" y="40" width="840" height="520" rx="22" fill="#0e1119" stroke="#262c3d" stroke-width="2"/>
  <rect x="80" y="60" width="800" height="480" rx="10" fill="url(#screen)"/>
  <!-- TV home: row of video tiles -->
  <text x="112" y="112" fill="#e8ebf2" font-size="22" font-weight="700">For you</text>
  <rect x="112" y="132" width="230" height="130" rx="10" fill="url(#t1)"/>
  <rect x="362" y="132" width="230" height="130" rx="10" fill="url(#t2)"/>
  <rect x="612" y="132" width="236" height="130" rx="10" fill="url(#t3)"/>
  <path d="M215 182l30 15-30 15z" fill="#fff" opacity=".9"/>
  <path d="M465 182l30 15-30 15z" fill="#fff" opacity=".9"/>
  <path d="M718 182l30 15-30 15z" fill="#fff" opacity=".9"/>
  <rect x="112" y="274" width="170" height="10" rx="5" fill="#e8ebf2" opacity=".7"/>
  <rect x="112" y="292" width="110" height="8" rx="4" fill="#9aa3b8" opacity=".6"/>
  <rect x="362" y="274" width="190" height="10" rx="5" fill="#e8ebf2" opacity=".7"/>
  <rect x="362" y="292" width="90" height="8" rx="4" fill="#9aa3b8" opacity=".6"/>
  <rect x="612" y="274" width="160" height="10" rx="5" fill="#e8ebf2" opacity=".7"/>
  <rect x="612" y="292" width="120" height="8" rx="4" fill="#9aa3b8" opacity=".6"/>
  <!-- second row, focused tile -->
  <rect x="112" y="330" width="230" height="130" rx="10" fill="url(#t4)"/>
  <rect x="106" y="324" width="242" height="142" rx="14" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="362" y="330" width="230" height="130" rx="10" fill="#262c3d"/>
  <rect x="612" y="330" width="236" height="130" rx="10" fill="#262c3d"/>
  <!-- blocked tile overlay -->
  <g transform="translate(612 330)">
    <rect width="236" height="130" rx="10" fill="#ff5d6c" opacity=".16"/>
    <circle cx="118" cy="58" r="22" fill="none" stroke="#ff5d6c" stroke-width="5"/>
    <path d="M102 74l32-32" stroke="#ff5d6c" stroke-width="5" stroke-linecap="round"/>
    <text x="118" y="110" text-anchor="middle" fill="#ffb1b8" font-size="15" font-weight="600">Blocked by Kid filter</text>
  </g>
  <!-- status chip -->
  <g transform="translate(640 82)">
    <rect width="208" height="36" rx="18" fill="#0b0d12" opacity=".75"/>
    <path d="M22 9l12 4v7c0 6-5 10-12 12-7-2-12-6-12-12v-7z" fill="url(#brand)"/>
    <text x="44" y="23" fill="#e8ebf2" font-size="14" font-weight="600">Rules on · 42 min left</text>
  </g>
  <!-- power LED -->
  <circle cx="480" cy="551" r="3" fill="#3ccf91"/>
</svg>
