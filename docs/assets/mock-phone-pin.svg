<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="16" y="8" width="288" height="616" rx="44" fill="#0e1119" stroke="#262c3d" stroke-width="2"/>
  </g>
  <rect x="28" y="20" width="264" height="592" rx="34" fill="#111113"/>
  <rect x="124" y="30" width="72" height="20" rx="10" fill="#0b0d12"/>
  <text x="52" y="45" fill="#f2f2f7" font-size="12" font-weight="600">19:42</text>
  <g fill="#f2f2f7"><rect x="236" y="37" width="20" height="10" rx="3" opacity=".9"/><rect x="258" y="40" width="2" height="4" rx="1"/></g>

  <text x="44" y="86" fill="#f2f2f7" font-size="18" font-weight="700">TV Remote</text>
  <circle cx="152" cy="80" r="4" fill="#30b350"/>

  <!-- lock badge -->
  <circle cx="160" cy="200" r="44" fill="url(#brand)" opacity=".18"/>
  <g fill="none" stroke="#a46bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="140" y="196" width="40" height="30" rx="6"/>
    <path d="M148 196v-8a12 12 0 0 1 24 0v8"/>
  </g>

  <rect x="44" y="272" width="232" height="208" rx="16" fill="#1c1c1f"/>
  <text x="160" y="308" text-anchor="middle" fill="#f2f2f7" font-size="17" font-weight="700">Enter the PIN</text>
  <text x="160" y="330" text-anchor="middle" fill="#9a9aa1" font-size="11">Shown in TV Remote on your computer</text>
  <!-- 6 digit boxes, 4 filled -->
  <g>
    <rect x="62"  y="352" width="28" height="40" rx="8" fill="#2a2a2f"/>
    <rect x="96"  y="352" width="28" height="40" rx="8" fill="#2a2a2f"/>
    <rect x="130" y="352" width="28" height="40" rx="8" fill="#2a2a2f"/>
    <rect x="164" y="352" width="28" height="40" rx="8" fill="#2a2a2f"/>
    <rect x="198" y="352" width="28" height="40" rx="8" fill="#2a2a2f" stroke="#5b8cff" stroke-width="2"/>
    <rect x="232" y="352" width="28" height="40" rx="8" fill="#2a2a2f"/>
    <g fill="#f2f2f7"><circle cx="76" cy="372" r="5"/><circle cx="110" cy="372" r="5"/><circle cx="144" cy="372" r="5"/><circle cx="178" cy="372" r="5"/></g>
  </g>
  <rect x="62" y="412" width="198" height="44" rx="12" fill="url(#brand)"/>
  <text x="161" y="439" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Connect</text>

  <text x="160" y="512" text-anchor="middle" fill="#9a9aa1" font-size="11">Only works on your home Wi-Fi</text>
  <text x="160" y="530" text-anchor="middle" fill="#9a9aa1" font-size="11">5 wrong tries locks it for 5 minutes</text>

  <rect x="120" y="600" width="80" height="4" rx="2" fill="#f2f2f7" opacity=".5"/>
</svg>
