<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5b8cff" stop-opacity=".5"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a46bff" stop-opacity=".45"/><stop offset="1" stop-color="#a46bff" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="630"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1200" height="630" fill="#0b0d12"/>
  <circle cx="220" cy="160" r="380" fill="url(#g1)"/>
  <circle cx="1020" cy="470" r="420" fill="url(#g2)"/>
  <g fill="none" stroke="url(#b)" stroke-linecap="round">
    <path d="M760 520a160 160 0 0 1 320 0" stroke-width="3" opacity=".5"/>
    <path d="M680 520a240 240 0 0 1 480 0" stroke-width="2" opacity=".3"/>
    <path d="M600 520a320 320 0 0 1 640 0" stroke-width="1.5" opacity=".16"/>
  </g>
  <!-- mini TV -->
  <rect x="790" y="300" width="260" height="170" rx="16" fill="#0e1119" stroke="#262c3d" stroke-width="2"/>
  <rect x="804" y="314" width="232" height="142" rx="8" fill="#161a33"/>
  <path d="M906 360l38 22-38 22z" fill="url(#b)"/>
  <path d="M890 484h60" stroke="#262c3d" stroke-width="10" stroke-linecap="round"/>
  <!-- logo + text -->
  <rect x="80" y="96" width="72" height="72" rx="16" fill="url(#b)"/>
  <rect x="94" y="114" width="44" height="29" rx="5" fill="none" stroke="#fff" stroke-width="5"/>
  <path d="M106 153h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M111 122l11 6.5-11 6.5z" fill="#fff"/>
  <text x="172" y="145" fill="#e8ebf2" font-size="34" font-weight="700">TV Remote</text>
  <text x="80" y="268" fill="#e8ebf2" font-size="58" font-weight="800" letter-spacing="-1">Your TVs, from your computer.</text>
  <text x="80" y="340" fill="#b49cff" font-size="58" font-weight="800" letter-spacing="-1">With rules kids can't skip.</text>
  <text x="80" y="420" fill="#9aa3b8" font-size="26">Remote · Phone remote · YouTube filters</text>
  <text x="80" y="458" fill="#9aa3b8" font-size="26">Screen time · Bedtime · Watch history</text>
  <text x="80" y="550" fill="#5b8cff" font-size="22" font-weight="600">Android TV and Google TV · Mac and Windows</text>
  </g>
</svg>
