<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6fdb"/><stop offset="1" stop-color="#3fd0e0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- menu bar strip -->
  <rect width="400" height="28" fill="#1b2030" opacity=".9"/>
  <g transform="translate(268 6)" fill="none" stroke="#e8ebf2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="2" width="20" height="13" rx="2.5"/><path d="M6 19h8"/><path d="M8 6l5 3-5 3z" fill="#e8ebf2" stroke="none"/>
  </g>
  <rect x="262" y="3" width="32" height="22" rx="5" fill="#fff" opacity=".12"/>
  <text x="380" y="19" text-anchor="end" fill="#e8ebf2" font-size="12" font-weight="500">Sat 19:42</text>
  <path d="M278 34l8-6 8 6z" fill="#141821"/>

  <!-- popover -->
  <g filter="url(#sh)">
    <rect x="20" y="34" width="360" height="590" rx="16" fill="#141821" stroke="#262c3d"/>
  </g>
  <!-- TV tabs -->
  <g font-size="13" font-weight="600">
    <rect x="36" y="50" width="128" height="30" rx="9" fill="url(#brand)"/>
    <circle cx="52" cy="65" r="4" fill="#3ccf91"/><text x="62" y="70" fill="#fff">Living room</text>
    <rect x="172" y="50" width="104" height="30" rx="9" fill="#1b2030"/>
    <circle cx="188" cy="65" r="4" fill="#9aa3b8"/><text x="198" y="70" fill="#9aa3b8">Kids room</text>
    <rect x="284" y="50" width="80" height="30" rx="9" fill="#1b2030"/>
    <text x="324" y="70" fill="#9aa3b8" text-anchor="middle">+ Add</text>
  </g>
  <!-- page tabs -->
  <g font-size="12" font-weight="600" fill="#9aa3b8">
    <text x="40" y="106" fill="#e8ebf2">Remote</text><text x="104" y="106">Apps</text><text x="152" y="106">Rules</text><text x="204" y="106">History</text>
    <rect x="40" y="112" width="46" height="2" rx="1" fill="#5b8cff"/>
  </g>
  <!-- now playing -->
  <rect x="36" y="126" width="328" height="104" rx="12" fill="#1b2030"/>
  <rect x="48" y="138" width="96" height="54" rx="7" fill="url(#thumb)"/>
  <path d="M90 156l14 9-14 9z" fill="#fff"/>
  <text x="156" y="154" fill="#e8ebf2" font-size="14" font-weight="600">Ocean animals for kids</text>
  <text x="156" y="172" fill="#9aa3b8" font-size="12">Nature Club · YouTube</text>
  <text x="156" y="190" fill="#3ccf91" font-size="11" font-weight="600">● Playing</text>
  <rect x="48" y="204" width="304" height="4" rx="2" fill="#262c3d"/>
  <rect x="48" y="204" width="118" height="4" rx="2" fill="url(#brand)"/>
  <text x="48" y="222" fill="#9aa3b8" font-size="11">04:12</text><text x="352" y="222" fill="#9aa3b8" font-size="11" text-anchor="end">-06:31</text>
  <!-- transport -->
  <g font-size="12" font-weight="600" fill="#e8ebf2" text-anchor="middle">
    <rect x="36" y="242" width="72" height="34" rx="10" fill="#1b2030"/><text x="72" y="264">−30s</text>
    <rect x="116" y="242" width="72" height="34" rx="10" fill="#1b2030"/><text x="152" y="264">−10s</text>
    <rect x="196" y="242" width="88" height="34" rx="10" fill="url(#brand)"/>
    <rect x="232" y="251" width="5" height="16" rx="1.5" fill="#fff"/><rect x="243" y="251" width="5" height="16" rx="1.5" fill="#fff"/>
    <rect x="292" y="242" width="72" height="34" rx="10" fill="#1b2030"/><text x="328" y="264">+30s</text>
  </g>
  <!-- d-pad -->
  <circle cx="170" cy="392" r="92" fill="#1b2030" stroke="#262c3d"/>
  <circle cx="170" cy="392" r="36" fill="#262c3d"/>
  <text x="170" y="398" text-anchor="middle" fill="#e8ebf2" font-size="15" font-weight="700">OK</text>
  <g fill="#9aa3b8">
    <path d="M170 318l10 12h-20z"/><path d="M170 466l10-12h-20z"/><path d="M96 392l12-10v20z"/><path d="M244 392l-12-10v20z"/>
  </g>
  <!-- volume slider -->
  <rect x="302" y="306" width="44" height="172" rx="14" fill="#1b2030"/>
  <rect x="318" y="320" width="12" height="144" rx="6" fill="#262c3d"/>
  <rect x="318" y="392" width="12" height="72" rx="6" fill="url(#brand)"/>
  <circle cx="324" cy="392" r="10" fill="#fff"/>
  <text x="324" y="498" text-anchor="middle" fill="#9aa3b8" font-size="11">Vol 18</text>
  <!-- back / home / power -->
  <g font-size="12" font-weight="600" fill="#e8ebf2" text-anchor="middle">
    <rect x="36" y="514" width="96" height="36" rx="10" fill="#1b2030"/><text x="84" y="537">← Back</text>
    <rect x="140" y="514" width="96" height="36" rx="10" fill="#1b2030"/><text x="188" y="537">⌂ Home</text>
    <rect x="244" y="514" width="120" height="36" rx="10" fill="#1b2030"/><text x="304" y="537" fill="#ff8a95">⏻ Power</text>
  </g>
  <!-- app shortcuts -->
  <g font-size="11" font-weight="600" fill="#9aa3b8" text-anchor="middle">
    <rect x="36" y="564" width="74" height="28" rx="14" fill="#1b2030"/><text x="73" y="582">YouTube</text>
    <rect x="116" y="564" width="74" height="28" rx="14" fill="#1b2030"/><text x="153" y="582">Netflix</text>
    <rect x="196" y="564" width="84" height="28" rx="14" fill="#1b2030"/><text x="238" y="582">Prime Video</text>
    <rect x="286" y="564" width="78" height="28" rx="14" fill="#1b2030"/><text x="325" y="582">All apps…</text>
  </g>
  <text x="200" y="612" text-anchor="middle" fill="#5a6378" font-size="10">Connected over Wi-Fi</text>
</svg>
