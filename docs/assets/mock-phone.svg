<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <!-- phone body -->
  <g filter="url(#sh)">
    <rect x="16" y="8" width="288" height="616" rx="44" fill="#0e1119" stroke="#262c3d" stroke-width="2"/>
  </g>
  <rect x="28" y="20" width="264" height="592" rx="34" fill="#111113"/>
  <rect x="124" y="30" width="72" height="20" rx="10" fill="#0b0d12"/>
  <!-- status bar -->
  <text x="52" y="45" fill="#f2f2f7" font-size="12" font-weight="600">19:42</text>
  <g fill="#f2f2f7"><rect x="236" y="37" width="20" height="10" rx="3" opacity=".9"/><rect x="258" y="40" width="2" height="4" rx="1"/></g>

  <!-- app header (matches helper/web: TV Remote + helper dot) -->
  <text x="44" y="86" fill="#f2f2f7" font-size="18" font-weight="700">TV Remote</text>
  <circle cx="152" cy="80" r="4" fill="#30b350"/>

  <!-- TV chips -->
  <g font-size="12" font-weight="600">
    <rect x="44" y="100" width="104" height="30" rx="15" fill="url(#brand)"/>
    <circle cx="60" cy="115" r="4" fill="#3ccf91"/><text x="70" y="119" fill="#fff">Living room</text>
    <rect x="156" y="100" width="92" height="30" rx="15" fill="#2a2a2f"/>
    <circle cx="172" cy="115" r="4" fill="#9a9aa1"/><text x="182" y="119" fill="#c9c9cf">Kids room</text>
  </g>

  <!-- page tabs -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="44" y="142" width="232" height="32" rx="10" fill="#1c1c1f"/>
    <rect x="48" y="146" width="56" height="24" rx="7" fill="#2a2a2f"/>
    <text x="76" y="162" fill="#f2f2f7">Remote</text>
    <text x="132" y="162" fill="#9a9aa1">Rules</text>
    <text x="190" y="162" fill="#9a9aa1">History</text>
    <text x="246" y="162" fill="#9a9aa1">Phone</text>
  </g>

  <!-- now playing card -->
  <rect x="44" y="186" width="232" height="92" rx="14" fill="#1c1c1f"/>
  <text x="58" y="210" fill="#f2f2f7" font-size="14" font-weight="700">Living room</text>
  <text x="58" y="228" fill="#9a9aa1" font-size="11">On · Playing · YouTube</text>
  <rect x="200" y="196" width="66" height="26" rx="8" fill="#2a2a2f"/>
  <text x="233" y="213" fill="#ff8a95" font-size="11" font-weight="600" text-anchor="middle">⏻ Power</text>
  <g font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="middle">
    <rect x="58" y="240" width="44" height="28" rx="8" fill="url(#brand)"/>
    <rect x="74" y="247" width="4" height="14" rx="1.5" fill="#fff"/><rect x="83" y="247" width="4" height="14" rx="1.5" fill="#fff"/>
    <rect x="108" y="240" width="56" height="28" rx="8" fill="#2a2a2f"/><text x="136" y="258">−10 s</text>
    <rect x="170" y="240" width="56" height="28" rx="8" fill="#2a2a2f"/><text x="198" y="258">+10 s</text>
  </g>

  <!-- d-pad, big thumb targets -->
  <rect x="44" y="290" width="232" height="208" rx="14" fill="#1c1c1f"/>
  <g fill="#2a2a2f">
    <rect x="124" y="302" width="72" height="52" rx="12"/>
    <rect x="124" y="434" width="72" height="52" rx="12"/>
    <rect x="56" y="368" width="64" height="52" rx="12"/>
    <rect x="200" y="368" width="64" height="52" rx="12"/>
  </g>
  <rect x="128" y="362" width="64" height="64" rx="32" fill="url(#brand)"/>
  <text x="160" y="399" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">OK</text>
  <g fill="#f2f2f7">
    <path d="M160 318l10 12h-20z"/><path d="M160 470l10-12h-20z"/><path d="M80 394l12-10v20z"/><path d="M240 394l-12-10v20z"/>
  </g>

  <!-- back / home / volume -->
  <g font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="middle">
    <rect x="44" y="510" width="72" height="40" rx="12" fill="#1c1c1f"/><text x="80" y="535">← Back</text>
    <rect x="124" y="510" width="72" height="40" rx="12" fill="#1c1c1f"/><text x="160" y="535">⌂ Home</text>
    <rect x="204" y="510" width="72" height="40" rx="12" fill="#1c1c1f"/><text x="248" y="535">Mute</text>
  </g>
  <path d="M213 526h4l5-4v14l-5-4h-4z" fill="#f2f2f7"/>
  <path d="M225 525l6 6M231 525l-6 6" stroke="#f2f2f7" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="44" y="562" width="232" height="28" rx="10" fill="#1c1c1f"/>
  <rect x="60" y="574" width="200" height="4" rx="2" fill="#2a2a2f"/>
  <rect x="60" y="574" width="72" height="4" rx="2" fill="url(#brand)"/>
  <circle cx="132" cy="576" r="7" fill="#fff"/>

  <rect x="120" y="600" width="80" height="4" rx="2" fill="#f2f2f7" opacity=".5"/>
</svg>
